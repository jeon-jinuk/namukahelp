
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>써클 멤버 목록</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="container">
  <h2>현재 멤버</h2>

  <table>
    <thead>
    <tr>
      <th>이름</th>
      <th>역할</th>
      <th>상태</th>
      <th>리더 위임</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="member : ${approvedMembers}">
      <td th:text="${member.member.name}">이름</td>
      <td th:text="${member.role}">역할</td>
      <td th:text="${member.status}">상태</td>
      <td>
        <form th:if="${isLeader} and ${member.member.id} != ${#authentication.principal.member.id}"
              th:action="@{/api/circles/{circleId}/transfer/{newLeaderId}(circleId=${circleId}, newLeaderId=${member.member.id})}"
              method="post" style="display:inline;">
          <input type="hidden" name="_method" value="put"/>
          <button type="submit" onclick="return confirm('정말 리더를 위임하시겠습니까?')">리더 위임</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div th:if="${isLeader}" style="margin-top: 40px;">
    <h3>가입 승인 대기 중</h3>
    <table>
      <thead>
      <tr>
        <th>이름</th>
        <th>승인/거절</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="pending : ${pendingMembers}">
        <td th:text="${pending.member.name}">이름</td>
        <td>
          <form th:action="@{/api/circles/{cid}/approve/{mid}(cid=${circleId}, mid=${pending.member.id})}" method="post" style="display:inline;">
            <button type="submit" onclick="return confirm('가입을 승인하시겠습니까?')">승인</button>
          </form>
          <form th:action="@{/api/circles/{cid}/reject/{mid}(cid=${circleId}, mid=${pending.member.id})}" method="post" style="display:inline;">
            <button type="submit" onclick="return confirm('가입을 거절하시겠습니까?')">거절</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
