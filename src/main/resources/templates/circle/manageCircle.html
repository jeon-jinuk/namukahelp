<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>  <title>\u 써클 관리 </title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="container" style="max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 th:text="${circle.name}">>\uc써클 이름</h2>

  <div style="margin-top: 30px; text-align: center;">

    <div class="button-wrapper" style="margin-bottom: 12px;">
      <button type="button" class="full-btn"
              th:onclick="|location.href='@{/circle/edit/{id}(id=${circle.id})}'|">
        수정
      </button>
    </div>


    <div style="margin-bottom: 12px; width: 100%;">
      <form th:action="@{/api/circles/{id}(id=${circle.id})}" method="post" style="display: block; width: 100%;">
        <input type="hidden" name="_method" value="delete"/>
        <button type="submit" class="full-btn" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
      </form>
    </div>

    <div style="margin-bottom: 12px; width: 100%; ">
      <form th:action="@{/api/circles/{id}/leave(id=${circle.id})}" method="post" style="display: block; width: 100%;">
        <input type="hidden" name="_method" value="delete"/>
        <button type="submit" class="full-btn" onclick="return confirm('정말 탈퇴하시겠습니까?')">탈퇴</button>
      </form>
    </div>

    <div class="button-wrapper" style="margin-bottom: 12px;">
      <button type="button" class="full-btn"
              th:onclick="|location.href='@{/circle/members/manage/{id}(id=${circle.id})}'|">
        멤버 관리
      </button>
    </div>


    <div style="margin-bottom: 10px; width: 100%;">
      <button type="button"
              th:onclick="|invitePrompt(${circle.id}, '${memberNickname}')|"
              class="full-btn">
        초대하기
      </button>
    </div>

  </div>


</div>
</div>

<script>
  function invitePrompt(circleId, requesterNickname) {
    const targetNickname = prompt('초대할 사용자의 닉네임을 입력하세요:');
    if (!targetNickname) return;

    fetch(`/api/circles/${circleId}/invite?requesterNickname=${encodeURIComponent(requesterNickname)}&memberNickname=${encodeURIComponent(targetNickname)}`, {
      method: "POST"
    })
            .then(response => {
              if (response.ok) {
                alert('초대가 완료되었습니다!');
                location.reload();
              } else {
                return response.text().then(msg => { throw new Error(msg); });
              }
            })
            .catch(error => {
              alert('오류 발생: ' + error.message);
            });
  }
</script>

</body>
</html>
