<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>멤버 관리</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="container">
  <h2>멤버 관리</h2>
  <h3>승인 대기 멤버</h3>
  <table>
    <thead>
    <tr>
      <th>이름</th>
      <th>상태</th>
      <th>액션</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="member : ${pendingMembers}">
      <td th:text="${member.member.nickname}">이름</td>
      <td>대기</td>
      <td>
        <form th:action="@{/circle/members/manage/{circleId}/approve(circleId=${circleId})}" method="post">
          <input type="hidden" name="memberId" th:value="${member.member.id}" />
          <button type="submit">승인</button>
        </form>

        <form th:action="@{/circle/members/manage/{circleId}/reject(circleId=${circleId})}" method="post">
          <input type="hidden" name="memberId" th:value="${member.member.id}" />
          <button type="submit">거절</button>
        </form>


      </td>
    </tr>
    </tbody>
  </table>

  <h3>가입된 멤버</h3>
  <table>
    <thead>
    <tr>
      <th>이름</th>
      <th>상태</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="member : ${approvedMembers}">
      <td th:text="${member.member.nickname}">이름</td>
      <td>가입됨</td>
      <td>

        <form th:action="@{/circle/members/manage/{circleId}/transfer-leader(circleId=${circleId})}" method="post">
          <input type="hidden" name="newLeaderId" th:value="${member.member.id}" />
          <button type="submit" onclick="return confirm('정말 이 멤버에게 리더를 위임하시겠습니까?')">리더 위임</button>
        </form>
      </td>
    </tr>
    </tbody>

  </table>

  <div th:if="${isLeader}">
    <a th:href="@{/circle/edit/{id}(id=${circle.id})}">
      <button>써클 수정</button>
    </a>
  </div>
</div>
</body>
</html>
