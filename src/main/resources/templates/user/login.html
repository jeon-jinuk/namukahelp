<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="container">
    <h2>로그인</h2>

    <div th:if="${param.error}" style="color:red; text-align: center; margin-bottom: 15px;">
        아이디 또는 비밀번호가 잘못되었습니다.
    </div>

    <div th:if="${param.logout}" style="color:green; text-align: center; margin-bottom: 15px;">
        로그아웃 되었습니다.
    </div>

    <!-- 로그인 form (1개만 유지) -->
    <form th:action="@{/user/login}" method="post" style="margin-bottom: 10px;" autocomplete="off">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" required/>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required/>
        </div>

        <button type="submit" class="full-btn" style="margin-bottom: 25px; margin-top: 8px" >로그인</button>
    </form>

    <form th:action="@{/user/join}" method="get" style="margin-top: 1px;" autocomplete="off">
        <button type="submit" class="full-btn">회원가입</button>
    </form>

</div>

</body>
</html>
