<!-- src/main/resources/templates/circle/edit.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>써클 수정</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="container">
  <h2>써클 수정</h2>

  <form th:action="@{/api/circles/{id}(id=${circle.id})}" method="post">
    <input type="hidden" name="_method" value="put"/> <!-- PUT 요청 처리 -->

    <div class="form-group">
      <label for="name">이름</label>
      <input type="text" id="name" name="name" th:value="${circle.name}" required/>
    </div>

    <div class="form-group">
      <label for="description">설명</label>
      <textarea id="description" name="description" required
                style="width:100%; height:100px; padding:10px; border:1px solid #ccc; border-radius:5px;">[[${circle.description}]]</textarea>
    </div>

    <div class="form-group">
      <label for="tags">태그 (쉼표로 구분)</label>
      <input type="text" id="tags" name="tags" th:value="${#strings.listJoin(circle.tags, ', ')}"/>
    </div>

    <div class="form-group">
      <label for="isPublic">공개 여부</label>
      <select id="isPublic" name="isPublic" required>
        <option value="true" th:selected="${circle.public} == true">공개</option>
        <option value="false" th:selected="${circle.public} == false">비공개</option>
      </select>
    </div>

    <button type="submit">수정 완료</button>
  </form>
</div>

</body>
</html>
