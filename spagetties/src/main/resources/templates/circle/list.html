
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>써클 목록</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="container">
    <h2>써클 목록</h2>

    <form id="searchForm" style="margin-bottom: 20px;">
        <div class="form-group">
            <label for="isPublic">공개 여부</label>
            <select id="isPublic" name="isPublic">
                <option value="">전체</option>
                <option value="true">공개</option>
                <option value="false">비공개</option>
            </select>
        </div>

        <div class="form-group">
            <label for="keyword">태그 검색</label>
            <input type="text" id="keyword" name="keyword" placeholder="태그 검색"/>
        </div>

        <button type="submit">검색</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>이름</th>
            <th>설명</th>
            <th>태그</th>
            <th>공개 여부</th>
            <th>가입</th>
        </tr>
        </thead>
        <tbody id="circleList">
        </tbody>
    </table>
</div>

<script>
    document.getElementById("searchForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const isPublic = document.getElementById("isPublic").value;
        const keyword = document.getElementById("keyword").value;
        let query = [];

        if (isPublic !== "") query.push(`isPublic=${isPublic}`);
        if (keyword !== "") query.push(`keyword=${encodeURIComponent(keyword)}`);

        const url = `/api/circles/search${query.length > 0 ? "?" + query.join("&") : ""}`;
        const res = await fetch(url);
        const data = await res.json();

        const table = document.getElementById("circleList");
        table.innerHTML = "";

        data.forEach(c => {
            const row = `<tr>
                <td>${c.name}</td>
                <td>${c.description}</td>
                <td>${c.tags}</td>
                <td>${c.public ? "공개" : "비공개"}</td>
                <td>
                    ${c.public && !c.alreadyJoined ? `
                        <form method="post" action="/api/circles/${c.id}/join" onsubmit="return confirm('가입하시겠습니까?')" style="display:inline;">
                            <button type="submit">가입</button>
                        </form>
                    ` : ""}
                </td>
            </tr>`;
            table.innerHTML += row;
        });
    });
</script>

</body>
</html>
