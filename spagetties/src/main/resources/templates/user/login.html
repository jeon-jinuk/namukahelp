<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css" />
</head>
<body>

<div class="login-wrapper">
    <main class="login-area">
        <h2 class="login-title">로그인</h2>

        <div th:if="${param.error}" class="alert-box error">
            아이디 또는 비밀번호가 잘못되었습니다.
        </div>

        <div th:if="${param.logout}" class="alert-box success">
            로그아웃 되었습니다.
        </div>

        <form th:action="@{/user/login}" method="post" autocomplete="off">
            <input type="text" id="username" name="username" class="input-field" placeholder="아이디" required>
            <input type="password" id="password" name="password" class="input-field" placeholder="비밀번호" required>
            <button type="submit" class="btn primary-btn">로그인</button>
        </form>

        <form th:action="@{/user/join}" method="get" autocomplete="off">
            <button type="submit" class="btn secondary-btn">회원가입</button>
        </form>
    </main>
</div>

</body>
</html>
