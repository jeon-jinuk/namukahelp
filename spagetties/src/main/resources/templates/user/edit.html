<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원정보 수정</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container" style="max-width: 500px; margin: 40px auto;">
  <h2>회원정보 수정</h2>
  <form th:action="@{/user/edit}" method="post">
    <div class="form-group">
      <label>이름</label>
      <input type="text" name="name" th:value="${member.name}" required>
    </div>
    <div class="form-group">
      <label>닉네임</label>
      <input type="text" name="nickname" th:value="${member.nickname}" required>
    </div>
    <div class="form-group">
      <label>이메일</label>
      <input type="email" name="email" th:value="${member.email}" required>
    </div>
    <div class="form-group">
      <label>전화번호</label>
      <input type="text" name="phone" th:value="${member.phone}" required>
    </div>


    <button type="submit"
            style="margin-top: 6px; width: 105%; line-height: 1; padding-top: 13px; padding-bottom: 11px;">
      수정하기</button>
  </form>
</div>
</body>
</html>
